name: Android Release Build & Upload

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build & Upload Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          APP_VER=$(grep "version:" pubspec.yaml | head -n 1 | awk '{print $2}')
          COMMIT_HASH=$(git rev-parse --short HEAD)
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --dart-define=APP_VERSION="$APP_VER" \
            --dart-define=GIT_COMMIT_HASH="$COMMIT_HASH"
          mkdir -p releases
          TAGGED_APK="releases/IT-PDF-v${APP_VER}-${COMMIT_HASH}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$TAGGED_APK"
          echo "TAGGED_APK=$TAGGED_APK" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IT-PDF-Android-APK
          path: ${{ env.TAGGED_APK }}
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: ${{ env.TAGGED_APK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
