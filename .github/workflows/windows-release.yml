name: Windows Release Build & Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Inno Setup Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Inno Setup 6
        shell: powershell
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows Release & Compile Installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File compile_inno.ps1

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IT-PDF-Windows-Installer
          path: releases/IT-PDF-x86_64-*-Installer.exe
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          files: releases/IT-PDF-x86_64-*-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
