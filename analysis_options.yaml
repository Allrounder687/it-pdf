include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - lib/features/editor/data/**
    - lib/features/editor/domain/**
    - lib/features/editor/presentation/editor_canvas_overlay.dart
    - lib/features/editor/presentation/editor_properties_panel.dart
    - test/pdf_content_editor_battle_test.dart
    - test/pdfium_save_test.dart
    - test/pdfium_test.dart
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
    deprecated_member_use: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - avoid_print
    - prefer_single_quotes
    - always_declare_return_types
    - cancel_subscriptions
    - close_sinks
